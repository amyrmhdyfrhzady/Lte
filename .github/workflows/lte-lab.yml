name: LTE Lab

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  lte-lab:
    runs-on: ubuntu-24.04

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System information
        run: |
          uname -a
          lsb_release -a || true
          nproc
          free -h
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            build-essential \
            cmake \
            pkg-config \
            libfftw3-dev \
            libmbedtls-dev \
            libsctp-dev \
            libyaml-cpp-dev \
            libboost-program-options-dev \
            libboost-system-dev \
            libboost-thread-dev \
            libzmq3-dev \
            libconfig++-dev \
            libpcsclite-dev \
            libtins-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libboost-test-dev \
            libboost-filesystem-dev \
            libboost-regex-dev \
            libboost-serialization-dev \
            libboost-date-time-dev \
            libboost-log-dev \
            libboost-random-dev \
            libboost-iostreams-dev \
            tshark \
            tcpdump \
            iproute2 \
            iptables \
            net-tools \
            lsof

      - name: Build srsRAN 4G
        run: |
          git clone --depth 1 https://github.com/srsran/srsRAN_4G.git srsRAN_4G

          cd srsRAN_4G

          mkdir build
          cd build

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_ZEROMQ=ON \
            -DENABLE_SRSUE=ON \
            -DENABLE_SRSENB=ON \
            -DENABLE_SRSEPC=ON \
            -DENABLE_GUI=OFF \
            -DENABLE_UHD=OFF \
            -DENABLE_BLADERF=OFF \
            -DENABLE_SOAPYSDR=OFF \
            -DENABLE_TTCN3=OFF \
            -DENABLE_ZMQ_TEST=ON

          make -j"$(nproc)"

      - name: Install srsRAN
        run: |
          cd srsRAN_4G/build
          sudo make install
          sudo ldconfig

      - name: Verify srsRAN
        run: |
          which srsenb
          which srsue
          which srsepc

          srsenb --version || true
          srsue --version || true
          srsepc --version || true

      - name: Install Open5GS
        run: |
          sudo add-apt-repository -y ppa:open5gs/latest
          sudo apt-get update
          sudo apt-get install -y open5gs mongodb-org

      - name: Start MongoDB
        run: |
          sudo systemctl start mongod
          sudo systemctl status mongod --no-pager

      - name: Prepare LTE network
        run: |
          chmod +x scripts/run-lte-lab.sh
          sudo ./scripts/run-lte-lab.sh prepare

      - name: Start LTE lab
        run: |
          sudo ./scripts/run-lte-lab.sh start

      - name: Run LTE test
        run: |
          sudo ./scripts/run-lte-lab.sh test

      - name: Collect logs
        if: always()
        run: |
          mkdir -p artifacts

          sudo cp -a /var/log/open5gs artifacts/open5gs 2>/dev/null || true

          sudo cp -a /tmp/lte-lab artifacts/lte-lab 2>/dev/null || true

          sudo journalctl -u mongod \
            --no-pager \
            > artifacts/mongodb.log 2>&1 || true

          sudo ss -lntup \
            > artifacts/network-sockets.txt 2>&1 || true

          sudo ip addr \
            > artifacts/ip-addresses.txt 2>&1 || true

          sudo ip route \
            > artifacts/ip-routes.txt 2>&1 || true

      - name: Stop LTE lab
        if: always()
        run: |
          sudo ./scripts/run-lte-lab.sh stop || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lte-lab-results
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
