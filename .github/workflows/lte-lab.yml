name: LTE Lab

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  lte-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System information
        run: |
          uname -a
          lsb_release -a || true
          nproc
          free -h
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            software-properties-common \
            ca-certificates \
            curl \
            gnupg \
            git \
            build-essential \
            cmake \
            pkg-config \
            libfftw3-dev \
            libmbedtls-dev \
            libsctp-dev \
            libyaml-cpp-dev \
            libboost-all-dev \
            libzmq3-dev \
            libconfig++-dev \
            libpcsclite-dev \
            libtins-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            tshark \
            tcpdump \
            iproute2 \
            iptables \
            net-tools \
            lsof

      - name: Install MongoDB
        run: |
          curl -fsSL https://pgp.mongodb.com/server-8.0.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg

          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/8.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list

          sudo apt-get update
          sudo apt-get install -y mongodb-org

          sudo systemctl start mongod
          sudo systemctl status mongod --no-pager

      - name: Install Open5GS
        run: |
          sudo add-apt-repository -y ppa:open5gs/latest
          sudo apt-get update
          sudo apt-get install -y open5gs

          open5gs-mmed --version || true
          open5gs-hssd --version || true

      - name: Build srsRAN 4G
        run: |
          git clone --depth 1 https://github.com/srsran/srsRAN_4G.git srsRAN_4G

          cd srsRAN_4G
          mkdir build
          cd build

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_ZEROMQ=ON \
            -DENABLE_SRSUE=ON \
            -DENABLE_SRSENB=ON \
            -DENABLE_SRSEPC=OFF \
            -DENABLE_GUI=OFF \
            -DENABLE_UHD=OFF \
            -DENABLE_BLADERF=OFF \
            -DENABLE_SOAPYSDR=OFF

          make -j"$(nproc)"

          sudo make install
          sudo ldconfig

      - name: Verify srsRAN
        run: |
          which srsenb
          which srsue

          srsenb --version || true
          srsue --version || true

      - name: Configure Open5GS
        run: |
          chmod +x scripts/run-lte-lab.sh
          sudo ./scripts/run-lte-lab.sh prepare

      - name: Start Open5GS
        run: |
          sudo ./scripts/run-lte-lab.sh start-core

      - name: Start LTE eNodeB
        run: |
          sudo ./scripts/run-lte-lab.sh start-enb

      - name: Run LTE UE
        run: |
          sudo ./scripts/run-lte-lab.sh test-ue

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p artifacts

          sudo cp -a /var/log/open5gs \
            artifacts/open5gs 2>/dev/null || true

          sudo cp -a /tmp/lte-lab \
            artifacts/lte-lab 2>/dev/null || true

          sudo journalctl \
            --no-pager \
            > artifacts/journal.log 2>&1 || true

          sudo ss -lntup \
            > artifacts/sockets.txt 2>&1 || true

          sudo ip addr \
            > artifacts/ip-addresses.txt 2>&1 || true

          sudo ip route \
            > artifacts/ip-routes.txt 2>&1 || true

      - name: Stop LTE lab
        if: always()
        run: |
          sudo ./scripts/run-lte-lab.sh stop || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lte-lab-results
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
