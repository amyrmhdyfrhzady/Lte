[rf]
device_name = zmq

device_args = tx_port=tcp://*:2001,rx_port=tcp://127.0.0.1:2000,id=ue,base_srate=23.04e6

[rat.eutra]
dl_earfcn = 3350

[usim]
mode = soft

algo = milenage

opc = 63BFA50EE6523365FF14C1F45F88737D

k = 00112233445566778899AABBCCDDEEFF

imsi = 901700123456789

imei = 353490069873319

[rrc]
release = 8

[nas]
apn = internet
apn_protocol = ipv4

[gw]
netns = ue1
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[log]
all_level = info
phy_level = info
mac_level = info
rlc_level = info
pdcp_level = info
rrc_level = debug
nas_level = debug

[pcap]
enable = true
filename = /tmp/lte-lab/ue.pcap
